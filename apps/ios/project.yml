name: Rawkoon
options:
  bundleIdPrefix: cloud.samlo
  deploymentTarget:
    iOS: "18.0"
packages:
  RawkoonKit:
    path: .
targets:
  Rawkoon:
    type: application
    platform: iOS
    sources: [Rawkoon]
    dependencies:
      - package: RawkoonKit
    info:
      path: Rawkoon/Info.plist
      properties:
        UIBackgroundModes: [audio, fetch]
        CFBundleDisplayName: Rawkoon
        ITSAppUsesNonExemptEncryption: false
        # iPhone-only (TARGETED_DEVICE_FAMILY = 1 below), so the iPad-multitasking
        # rule that demands all four orientations does not apply and the player
        # can stay portrait-only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # An empty UILaunchScreen dict satisfies the launch-screen requirement
        # for MinimumOSVersion >= 14 without a storyboard.
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cloud.samlo.rawkoon
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: SSU33B2E5B
      CODE_SIGN_STYLE: Automatic
