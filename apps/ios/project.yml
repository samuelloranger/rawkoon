name: Rawkoon
options:
  bundleIdPrefix: cloud.samlo
  deploymentTarget:
    iOS: "18.0"
packages:
  RawkoonKit:
    path: .
  # Pinned to an exact release so builds stay reproducible. OPDS and LCP
  # products are excluded; we do not use them.
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.0
targets:
  Rawkoon:
    type: application
    platform: iOS
    sources: [Rawkoon]
    dependencies:
      - package: RawkoonKit
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    info:
      path: Rawkoon/Info.plist
      properties:
        UIBackgroundModes: [audio, fetch, remote-notification]
        # CarPlay scene ONLY. We do not declare UIWindowSceneSessionRoleApplication:
        # omitting it lets SwiftUI keep managing the phone WindowGroup. Declaring a
        # UIKit window SceneDelegate here would drag the phone UI off SwiftUI.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # Declares the app as a long-form audio player before the session is
        # ever configured, so AirPlay route suggestions are right from launch.
        AVInitialRouteSharingPolicy: LongFormAudio
        CFBundleDisplayName: Rawkoon
        ITSAppUsesNonExemptEncryption: false
        # Wire the version/build strings to the build settings so CI's
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION overrides actually reach
        # the binary (XcodeGen otherwise bakes literal "1.0"/"1", which made
        # every TestFlight upload look like a duplicate build).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Cozy Dusk display face. Fraunces ships as one variable TTF; iOS reads it
        # under the family name "Fraunces". Theme.display() falls back to the
        # system serif if this ever fails to register.
        UIAppFonts:
          - Fraunces.ttf
        # Dark-only by design — audiobooks and late-night queue-watching live at
        # night, and the whole palette is built for a dim room.
        UIUserInterfaceStyle: Dark
        # iPhone-only (TARGETED_DEVICE_FAMILY = 1 below), so the iPad-multitasking
        # rule that demands all four orientations does not apply and the player
        # can stay portrait-only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # An empty UILaunchScreen dict satisfies the launch-screen requirement
        # for MinimumOSVersion >= 14 without a storyboard.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.samlo.rawkoon
        MARKETING_VERSION: "1.12.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: SSU33B2E5B
        CODE_SIGN_STYLE: Automatic
      configs:
        # Entitlements are set per-config, not in `base`: Debug/simulator carries
        # com.apple.developer.carplay-audio so the CarPlay scene connects, but
        # Release must NOT — that entitlement is not yet granted on the "Rawkoon
        # AppStore CI" profile and its presence would fail distribution signing.
        # Keeping it out of `base` means no future config inherits it by accident.
        # Flip both to the shared file once Apple grants the entitlement.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Rawkoon/Rawkoon.Debug.entitlements
        # Signing lives on the app target, not on the xcodebuild command line.
        # A command-line override applies to every target in the project, and
        # SPM package targets reject a provisioning profile outright — which is
        # what broke the first archive after Readium was added. Release only, so
        # a local device build still signs automatically.
        Release:
          CODE_SIGN_ENTITLEMENTS: Rawkoon/Rawkoon.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Rawkoon AppStore CI"
