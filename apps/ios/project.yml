name: Rawkoon
options:
  bundleIdPrefix: cloud.samlo
  deploymentTarget:
    iOS: "18.0"
targets:
  Rawkoon:
    type: application
    platform: iOS
    sources: [Rawkoon]
    info:
      path: Rawkoon/Info.plist
      properties:
        UIBackgroundModes: [audio, fetch]
        CFBundleDisplayName: Rawkoon
        ITSAppUsesNonExemptEncryption: false
        # App Store validation rejects a bundle with no declared orientations
        # (it assumes iPad multitasking). The player is portrait-first; landscape
        # is allowed so it is not rejected and reads fine on iPad.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # An empty UILaunchScreen dict satisfies the launch-screen requirement
        # for MinimumOSVersion >= 14 without a storyboard.
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cloud.samlo.rawkoon
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: SSU33B2E5B
      CODE_SIGN_STYLE: Automatic
