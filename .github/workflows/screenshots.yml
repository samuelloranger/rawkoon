name: Screenshots

# Regenerates README screenshots against seeded demo data on every release,
# and commits them back to the default branch. Manually runnable too.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: rawkoon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://demo:demo@localhost:5432/rawkoon
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      SECRET_KEY: ci-screenshot-secret-key-0123456789abcdef
      BETTER_AUTH_SECRET: ci-screenshot-auth-secret-0123456789abcdef
      BASE_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      API_PORT: '3000'
      SCREENSHOT_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - run: bun install --frozen-lockfile

      - name: Build web SPA
        run: bun run build
        working-directory: apps/web

      - name: Serve SPA from the API (auto-detected ./public)
        run: cp -r apps/web/dist apps/api/public

      - name: Migrate + generate Prisma client
        run: bunx prisma migrate deploy && bunx prisma generate
        working-directory: apps/api

      - name: Seed demo data
        run: bun scripts/screenshot/seed.ts

      - name: Start API
        run: |
          (cd apps/api && bun src/index.ts &)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done

      - name: Capture screenshots
        run: bun scripts/screenshot/shots.ts

      # Rebase-and-retry rather than a plain push: main can advance between
      # checkout and here (the release commit is often followed quickly by
      # other pushes), which made a bare push non-fast-forward and failed.
      - name: Commit and push screenshots
        run: |
          set -euo pipefail
          branch="${{ github.event.repository.default_branch }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # status, not diff: a newly added file is untracked and diff ignores it.
          if [ -z "$(git status --porcelain -- docs/screenshots)" ]; then
            echo "No screenshot changes to commit"; exit 0
          fi
          git add -A docs/screenshots
          git commit -m 'docs: update README screenshots [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"; sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after 5 attempts"; exit 1
