name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Format check (Biome — web + API + shared)
        run: bun run formatCheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Lint (Biome on web + API + shared — Makefile `make lint` matches)
        run: bun run lint
      - name: Dead code (knip)
        # apps/api/prisma.config.ts resolves DATABASE_URL at load; any value works.
        env:
          DATABASE_URL: postgresql://knip:knip@localhost:5432/knip
        run: bun run knip
      - name: No hardcoded toast copy
        run: |
          if grep -RInE 'toast\.(error|success|info|warning)\(\s*["'\''`]' apps/web/src --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "Hardcoded toast strings — use t() / i18n.t()" >&2
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Typecheck (tsc / TS 7)
        run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Production web build
        run: bun run build

  test:
    runs-on: ubuntu-latest
    # A test process that never exits otherwise holds the job for GitHub's 6h default.
    timeout-minutes: 25
    # Disposable database for the endpoint sweep; the harness refuses any name not ending in _e2e/_test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rawkoon
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: rawkoon_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rawkoon -d rawkoon_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      # Normally ~20s; a stalled apt mirror used to hold the job until its 25-minute timeout.
      - name: Install ffmpeg
        timeout-minutes: 3
        run: |
          # man-db re-indexes every manual page after an install, which crawls on hosted runners.
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          # A stalled mirror hangs a whole attempt, so bound each one and retry within the step guard.
          for attempt in 1 2 3; do
            sudo timeout 50 sh -c "apt-get update -y $APT && apt-get install -y --no-install-recommends $APT ffmpeg" && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt attempt $attempt failed, retrying"
            sleep 3
          done
          ffprobe -version | head -1
      # One step per suite, each with its own timeout, so a hang fails fast and names its suite.
      - name: Web tests
        timeout-minutes: 5
        run: cd apps/web && bun run test --run
      - name: API tests
        timeout-minutes: 10
        run: cd apps/api && bun run test
      - name: Relay tests
        timeout-minutes: 3
        run: cd apps/relay && bun run test
      # Every API route: valid input, invalid input (400) and auth (401/403); fails on an unfixtured route.
      - name: E2E endpoint sweep
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql://rawkoon:e2e@localhost:5432/rawkoon_e2e
          SECRET_KEY: ci-e2e-throwaway-secret-0123456789abcdef
          BETTER_AUTH_SECRET: ci-e2e-throwaway-secret-0123456789abcdef
        run: |
          cd apps/api
          bunx prisma generate
          bunx prisma migrate deploy
          bun run e2e:endpoints
