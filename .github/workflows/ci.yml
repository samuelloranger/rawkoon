name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Format check (Biome — web + API + shared)
        run: bun run formatCheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Lint (Biome on web + API + shared — Makefile `make lint` matches)
        run: bun run lint
      - name: Dead code (knip)
        # apps/api/prisma.config.ts resolves DATABASE_URL at load; any value works.
        env:
          DATABASE_URL: postgresql://knip:knip@localhost:5432/knip
        run: bun run knip
      - name: No hardcoded toast copy
        run: |
          if grep -RInE 'toast\.(error|success|info|warning)\(\s*["'\''`]' apps/web/src --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "Hardcoded toast strings — use t() / i18n.t()" >&2
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Typecheck (tsc / TS 7)
        run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Production web build
        run: bun run build

  test:
    runs-on: ubuntu-latest
    # A test process that never exits otherwise holds the job for GitHub's 6h default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate-routes: "true"
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      # One step per suite, each with its own timeout, so a hang fails fast and names its suite.
      - name: Web tests
        timeout-minutes: 5
        run: cd apps/web && bun run test --run
      - name: API tests
        timeout-minutes: 10
        run: cd apps/api && bun run test
      - name: Relay tests
        timeout-minutes: 3
        run: cd apps/relay && bun run test
