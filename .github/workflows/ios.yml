name: iOS
on:
  # NOTE: do not add `tags:` to the push trigger. GitHub treats a push trigger
  # carrying `tags` but no `branches` as tag-only, which silently stops branch
  # pushes from building at all.
  #
  # TestFlight uploads are gated on a published GitHub release and nothing else.
  # Pushes to main (and every other branch) run kit+lint+build only — they never
  # upload. A successful upload consumes a (version, build) pair, so it must be a
  # deliberate act, not a side effect of merging.
  push:
    branches: ["**"]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**"]
  release:
    types: [published]
  workflow_dispatch:
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test
        working-directory: apps/ios

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH (image ships it unlinked)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: brew install swiftlint swiftformat
      - run: python3 scripts/check-l10n.py
        working-directory: apps/ios
      - run: python3 scripts/check-env-inject.py
        working-directory: apps/ios
      - run: swiftformat Rawkoon RawkoonTests Sources Tests --lint
        working-directory: apps/ios
      - run: swiftlint lint
        working-directory: apps/ios

  build:
    runs-on: xcode-27
    needs: [kit, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and simulators
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true
          xcrun simctl list devices available | grep -iA30 'iOS 27' || true
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      # The runner's exact iOS 27 device set isn't pinned here — resolve one at
      # runtime so a device-name change on the image doesn't break the test.
      - name: Resolve an iOS 27 iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"]
                 for rt, ds in devices.items() if "iOS-27" in rt
                 for d in ds if "iPhone" in d["name"]]
          print(ids[0] if ids else "")')
          if [ -z "$UDID" ]; then echo "No iOS 27 iPhone simulator on runner" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run app-target tests (iOS 27)
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -project Rawkoon.xcodeproj -scheme Rawkoon \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RawkoonTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for simulator
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Rawkoon.xcodeproj -scheme Rawkoon \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    runs-on: xcode-27
    needs: build
    # A published GitHub release is the ONLY thing that uploads to TestFlight.
    # Not a push to main, not a manual dispatch, not a PR — an upload consumes a
    # (version, build) pair and must be deliberate. To ship: cut a release.
    if: github.event_name == 'release'
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Resolve release version
        working-directory: apps/ios
        run: |
          # The release tag is authoritative for a release build; package.json is
          # the fallback if the tag is not version-shaped.
          TAG="${{ github.event.release.tag_name }}"
          MARKETING_VERSION="${TAG#v}"
          case "$MARKETING_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) MARKETING_VERSION="$(python3 -c 'import json; print(json.load(open("../../package.json"))["version"])')" ;;
          esac
          if [ -z "$MARKETING_VERSION" ]; then
            echo "Could not resolve MARKETING_VERSION" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_ENV"
          # Rawkoon has one publishing lane; github.run_number is already monotonic.
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - run: xcodegen generate
        working-directory: apps/ios
      # Pinned signing: import a fixed distribution cert + App Store profile from
      # secrets into a temporary keychain and sign manually. This replaces
      # -allowProvisioningUpdates, which minted a fresh cert on every run and
      # kept hitting Apple's certificate cap (and spamming revocation emails).
      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      # Signing settings live on the app target in project.yml, not here: an
      # xcodebuild command-line setting applies to every target in the project,
      # and SPM package targets reject a provisioning profile.
      - name: Archive signed app
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Rawkoon.xcodeproj \
            -scheme Rawkoon \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rawkoon.xcarchive \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - name: Export IPA
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Rawkoon.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
      - name: Upload to TestFlight
        working-directory: apps/ios
        run: |
          IPA_PATH=""
          for candidate in build/export/*.ipa; do
            IPA_PATH="$candidate"
            break
          done
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA produced by export step" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Distribute to internal testers
        working-directory: apps/ios
        env:
          BUNDLE_ID: cloud.samlo.rawkoon
          BUILD_NUMBER: ${{ env.CURRENT_PROJECT_VERSION }}
          WHATS_NEW: "Release ${{ github.event.release.tag_name }} (${{ github.sha }})"
        run: node scripts/asc-distribute.mjs
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-ipa-${{ github.sha }}
          path: apps/ios/build/export/*.ipa
          if-no-files-found: warn
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-xcarchive-${{ github.sha }}
          path: apps/ios/build/Rawkoon.xcarchive
          if-no-files-found: warn

  testflight-mac:
    runs-on: xcode-27
    needs: build
    # Same rule as the iOS lane — only a published release uploads. This lane
    # archives the Mac Catalyst build and uploads it to the SAME app's macOS
    # platform (DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER=NO keeps the bundle
    # id). Dormant until the Mac signing assets exist: set the repo VARIABLE
    # MAC_TESTFLIGHT_ENABLED=true once the MAC_* secrets below are in place, so
    # releases don't go red before Mac distribution is set up.
    if: github.event_name == 'release' && vars.MAC_TESTFLIGHT_ENABLED == 'true'
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Resolve release version
        working-directory: apps/ios
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MARKETING_VERSION="${TAG#v}"
          case "$MARKETING_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) MARKETING_VERSION="$(python3 -c 'import json; print(json.load(open("../../package.json"))["version"])')" ;;
          esac
          if [ -z "$MARKETING_VERSION" ]; then echo "Could not resolve MARKETING_VERSION" >&2; exit 1; fi
          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_ENV"
          # Same monotonic build number as the iOS lane; platforms track builds separately.
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
      - run: xcodegen generate
        working-directory: apps/ios
      # Mac App Store signing needs two certificates plus the profile:
      #   - the APP is signed with the cross-platform "Apple Distribution" cert,
      #     which is the SAME one the iOS lane already uses — reuse its secrets
      #     (BUILD_CERTIFICATE_BASE64 / P12_PASSWORD), no new app cert.
      #   - the installer .pkg is signed with a "Mac Installer Distribution"
      #     ("3rd Party Mac Developer Installer") cert — Mac-only, create it and add:
      #       MAC_INSTALLER_CERTIFICATE_BASE64  base64 of that .p12
      #       MAC_INSTALLER_P12_PASSWORD        its password
      #   - MAC_BUILD_PROVISION_PROFILE_BASE64  base64 of the macOS .provisionprofile,
      #     named "Rawkoon Mac AppStore CI" (matches project.yml) for cloud.samlo.rawkoon.
      - name: Install Mac signing certificates and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT_PATH="$RUNNER_TEMP/app-cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/mac-profile.provisionprofile"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$APP_CERT_PATH"
          echo -n "$MAC_INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"
          echo -n "$MAC_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$MAC_INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive signed Mac Catalyst app
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Rawkoon.xcodeproj \
            -scheme Rawkoon \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath build/Rawkoon-mac.xcarchive \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - name: Export pkg
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Rawkoon-mac.xcarchive \
            -exportPath build/export-mac \
            -exportOptionsPlist ExportOptionsMac.plist
      - name: Upload to TestFlight (macOS)
        working-directory: apps/ios
        run: |
          PKG_PATH=""
          for candidate in build/export-mac/*.pkg; do PKG_PATH="$candidate"; break; done
          if [ -z "$PKG_PATH" ]; then echo "No pkg produced by export step" >&2; exit 1; fi
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      # Auto tester-distribution is intentionally omitted: scripts/asc-distribute.mjs
      # matches a build by (app, CFBundleVersion), and the iOS and Mac builds share
      # a run-number version — it could attach the wrong platform's build. Add the
      # Mac build to a TestFlight group in App Store Connect by hand, or make
      # asc-distribute platform-aware first.
      - name: Upload pkg artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-pkg-${{ github.sha }}
          path: apps/ios/build/export-mac/*.pkg
          if-no-files-found: warn
      - name: Upload Mac archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-mac-xcarchive-${{ github.sha }}
          path: apps/ios/build/Rawkoon-mac.xcarchive
          if-no-files-found: warn
