name: iOS
on:
  # NOTE: do not add `tags:` to the push trigger. GitHub treats a push trigger
  # carrying `tags` but no `branches` as tag-only, which silently stops branch
  # pushes from building at all.
  #
  # TestFlight uploads happen on three lanes:
  #   - edge: a push to main that changes the app uploads it as the next patch
  #     version (X.Y.Z+1), so a fix reaches internal testers with a merge
  #   - release: a published GitHub release uploads X.Y.Z
  #   - manual: a dispatch with testflight=true uploads any branch
  # Pushes to other branches run kit+lint+build only. The build number is
  # github.run_number, shared by every lane and never reused.
  push:
    branches: ["**"]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload this ref to TestFlight (internal testers)"
        type: boolean
        default: false
      marketing_version:
        description: "Version for the TestFlight build (default: package.json)"
        type: string
        required: false
jobs:
  # Decides whether a push to main ships to TestFlight, and as which version.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.plan.outputs.ship }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          PARENT_VERSION="$(git show HEAD^:package.json 2>/dev/null | jq -r .version || true)"
          SHIP=true
          if [ "$VERSION" != "$PARENT_VERSION" ]; then
            # The version bump is the release commit: its release uploads it as X.Y.Z.
            echo "This commit bumps the version to $VERSION; its release uploads it"
            SHIP=false
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          {
            echo "ship=$SHIP"
            echo "version=$MAJOR.$MINOR.$((PATCH + 1))"
          } | tee -a "$GITHUB_OUTPUT"

  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test
        working-directory: apps/ios

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH (image ships it unlinked)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: brew install swiftlint swiftformat
      - run: python3 scripts/check-l10n.py
        working-directory: apps/ios
      - run: python3 scripts/check-env-inject.py
        working-directory: apps/ios
      - run: python3 scripts/check-raw-animation.py
        working-directory: apps/ios
      - run: swiftformat Rawkoon RawkoonTests RawkoonWidgets WidgetSupport Sources Tests --lint
        working-directory: apps/ios
      - run: swiftlint lint
        working-directory: apps/ios

  build:
    runs-on: macos-26
    needs: [kit, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and simulators
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true
          xcrun simctl list devices available | grep -iA30 'iOS 26' || true
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      # The runner's exact iOS 26 device set isn't pinned here — resolve one at
      # runtime so a device-name change on the image doesn't break the test.
      - name: Resolve an iOS 26 iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"]
                 for rt, ds in devices.items() if "iOS-26" in rt
                 for d in ds if "iPhone" in d["name"]]
          print(ids[0] if ids else "")')
          if [ -z "$UDID" ]; then echo "No iOS 26 iPhone simulator on runner" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run app-target tests (iOS 26)
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -project Rawkoon.xcodeproj -scheme Rawkoon \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RawkoonTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for simulator
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Rawkoon.xcodeproj -scheme Rawkoon \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    runs-on: macos-26
    needs: [build, edge]
    # `edge` is skipped off a push to main, so the condition names build's result itself.
    if: >-
      !cancelled() && needs.build.result == 'success' && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
        needs.edge.outputs.ship == 'true')
    # Edge runs are not queued: a concurrency group keeps one pending run and drops the
    # rest, which could drop the newest commit. The freshness check below filters out a
    # build main has already moved past; in the few minutes between that check and the
    # upload, a newer run can still finish first, and App Store Connect then rejects the
    # older, lower build number of the same version.
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Resolve release version
        working-directory: apps/ios
        run: |
          # The release tag is authoritative for a release build, the edge plan for a
          # push to main; package.json is the fallback if neither is version-shaped.
          TAG="${{ github.event.release.tag_name || inputs.marketing_version || needs.edge.outputs.version }}"
          MARKETING_VERSION="${TAG#v}"
          case "$MARKETING_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) MARKETING_VERSION="$(python3 -c 'import json; print(json.load(open("../../package.json"))["version"])')" ;;
          esac
          if [ -z "$MARKETING_VERSION" ]; then
            echo "Could not resolve MARKETING_VERSION" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_ENV"
          # Every lane runs in this workflow, so github.run_number never repeats.
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - run: xcodegen generate
        working-directory: apps/ios
      # Pinned signing: import a fixed distribution cert + App Store profile from
      # secrets into a temporary keychain and sign manually. This replaces
      # -allowProvisioningUpdates, which minted a fresh cert on every run and
      # kept hitting Apple's certificate cap (and spamming revocation emails).
      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/widget-profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -z "$WIDGET_PROVISION_PROFILE_BASE64" ]; then
            echo "WIDGET_PROVISION_PROFILE_BASE64 is required for Rawkoon Widgets" >&2
            exit 1
          fi
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          echo -n "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o "$WIDGET_PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp "$WIDGET_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      # Signing settings live on the app target in project.yml, not here: an
      # xcodebuild command-line setting applies to every target in the project,
      # and SPM package targets reject a provisioning profile.
      - name: Archive signed app
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Rawkoon.xcodeproj \
            -scheme Rawkoon \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rawkoon.xcarchive \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - name: Export IPA
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Rawkoon.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
      # An edge build uploads only while main has nothing newer for the app: a later push
      # that changed it has its own run, and a version bump has its release. Otherwise an
      # older build could reach testers after a newer one.
      - name: Check main has nothing newer for the app
        id: fresh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          UPLOAD=true
          if [ "$EVENT" = push ]; then
            git fetch --quiet --depth=1 origin main
            OURS="$(jq -r .version package.json)"
            THEIRS="$(git show FETCH_HEAD:package.json | jq -r .version)"
            if [ "$OURS" != "$THEIRS" ]; then
              echo "main is on $THEIRS now; its release uploads it"
              UPLOAD=false
            elif ! git diff --quiet HEAD FETCH_HEAD -- apps/ios .github/workflows/ios.yml; then
              echo "main has newer app changes; their run uploads them"
              UPLOAD=false
            fi
          fi
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        if: steps.fresh.outputs.upload == 'true'
        working-directory: apps/ios
        run: |
          IPA_PATH=""
          for candidate in build/export/*.ipa; do
            IPA_PATH="$candidate"
            break
          done
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA produced by export step" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Distribute to internal testers
        if: steps.fresh.outputs.upload == 'true'
        working-directory: apps/ios
        env:
          BUNDLE_ID: cloud.samlo.rawkoon
          BUILD_NUMBER: ${{ env.CURRENT_PROJECT_VERSION }}
          WHATS_NEW: "${{ github.event.release.tag_name && format('Release {0}', github.event.release.tag_name) || github.event_name == 'push' && 'Edge build of main' || format('Pre-release build of {0}', github.ref_name) }} (${{ github.sha }})"
        run: node scripts/asc-distribute.mjs
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-ipa-${{ github.sha }}
          path: apps/ios/build/export/*.ipa
          if-no-files-found: warn
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-xcarchive-${{ github.sha }}
          path: apps/ios/build/Rawkoon.xcarchive
          if-no-files-found: warn

  testflight-mac:
    runs-on: macos-26
    needs: [build, edge]
    # Same lanes as iOS (edge and release; no manual upload). This lane
    # archives the Mac Catalyst build and uploads it to the SAME app's macOS
    # platform (DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER=NO keeps the bundle
    # id). Dormant until the Mac signing assets exist: set the repo VARIABLE
    # MAC_TESTFLIGHT_ENABLED=true once the MAC_* secrets below are in place, so
    # releases don't go red before Mac distribution is set up.
    if: >-
      !cancelled() && needs.build.result == 'success' && vars.MAC_TESTFLIGHT_ENABLED == 'true' && (
        github.event_name == 'release' || needs.edge.outputs.ship == 'true')
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Resolve release version
        working-directory: apps/ios
        run: |
          TAG="${{ github.event.release.tag_name || needs.edge.outputs.version }}"
          MARKETING_VERSION="${TAG#v}"
          case "$MARKETING_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) MARKETING_VERSION="$(python3 -c 'import json; print(json.load(open("../../package.json"))["version"])')" ;;
          esac
          if [ -z "$MARKETING_VERSION" ]; then echo "Could not resolve MARKETING_VERSION" >&2; exit 1; fi
          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_ENV"
          # Same monotonic build number as the iOS lane; platforms track builds separately.
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
      - run: xcodegen generate
        working-directory: apps/ios
      # Mac App Store signing needs two certificates plus the profile:
      #   - the APP is signed with the cross-platform "Apple Distribution" cert,
      #     which is the SAME one the iOS lane already uses — reuse its secrets
      #     (BUILD_CERTIFICATE_BASE64 / P12_PASSWORD), no new app cert.
      #   - the installer .pkg is signed with a "Mac Installer Distribution"
      #     ("3rd Party Mac Developer Installer") cert — Mac-only, create it and add:
      #       MAC_INSTALLER_CERTIFICATE_BASE64  base64 of that .p12
      #       MAC_INSTALLER_P12_PASSWORD        its password
      #   - MAC_BUILD_PROVISION_PROFILE_BASE64  base64 of the macOS .provisionprofile,
      #     named "Rawkoon Mac AppStore CI" (matches project.yml) for cloud.samlo.rawkoon.
      - name: Install Mac signing certificates and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT_PATH="$RUNNER_TEMP/app-cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/mac-profile.provisionprofile"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$APP_CERT_PATH"
          echo -n "$MAC_INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"
          echo -n "$MAC_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$MAC_INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive signed Mac Catalyst app
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Rawkoon.xcodeproj \
            -scheme Rawkoon \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath build/Rawkoon-mac.xcarchive \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      # Build the App Store pkg with productbuild instead of `xcodebuild
      # -exportArchive`. The archived .app is already Apple Distribution-signed
      # (Release config), and -exportArchive's manual path wrongly validates the
      # installer cert against the app provisioning profile ("doesn't include
      # signing certificate 3rd Party Mac Developer Installer") and fails.
      # productbuild just wraps the signed app and signs the installer pkg.
      - name: Package + sign App Store pkg
        working-directory: apps/ios
        run: |
          APP="$(ls -d build/Rawkoon-mac.xcarchive/Products/Applications/*.app | head -1)"
          if [ -z "$APP" ]; then echo "No .app in archive" >&2; exit 1; fi
          INSTALLER_ID="$(security find-identity -v | grep "3rd Party Mac Developer Installer" | head -1 | awk '{print $2}')"
          if [ -z "$INSTALLER_ID" ]; then echo "No Mac Installer Distribution identity in keychain" >&2; exit 1; fi
          mkdir -p build/export-mac
          xcrun productbuild \
            --sign "$INSTALLER_ID" \
            --component "$APP" /Applications \
            build/export-mac/Rawkoon.pkg
      # An edge build uploads only while main has nothing newer for the app: a later push
      # that changed it has its own run, and a version bump has its release. Otherwise an
      # older build could reach testers after a newer one.
      - name: Check main has nothing newer for the app
        id: fresh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          UPLOAD=true
          if [ "$EVENT" = push ]; then
            git fetch --quiet --depth=1 origin main
            OURS="$(jq -r .version package.json)"
            THEIRS="$(git show FETCH_HEAD:package.json | jq -r .version)"
            if [ "$OURS" != "$THEIRS" ]; then
              echo "main is on $THEIRS now; its release uploads it"
              UPLOAD=false
            elif ! git diff --quiet HEAD FETCH_HEAD -- apps/ios .github/workflows/ios.yml; then
              echo "main has newer app changes; their run uploads them"
              UPLOAD=false
            fi
          fi
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight (macOS)
        if: steps.fresh.outputs.upload == 'true'
        working-directory: apps/ios
        run: |
          PKG_PATH=""
          for candidate in build/export-mac/*.pkg; do PKG_PATH="$candidate"; break; done
          if [ -z "$PKG_PATH" ]; then echo "No pkg produced by export step" >&2; exit 1; fi
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      # Auto tester-distribution is intentionally omitted: scripts/asc-distribute.mjs
      # matches a build by (app, CFBundleVersion), and the iOS and Mac builds share
      # a run-number version — it could attach the wrong platform's build. Add the
      # Mac build to a TestFlight group in App Store Connect by hand, or make
      # asc-distribute platform-aware first.
      - name: Upload pkg artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-pkg-${{ github.sha }}
          path: apps/ios/build/export-mac/*.pkg
          if-no-files-found: warn
      - name: Upload Mac archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-mac-xcarchive-${{ github.sha }}
          path: apps/ios/build/Rawkoon-mac.xcarchive
          if-no-files-found: warn
