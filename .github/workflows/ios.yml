name: iOS
on:
  # NOTE: do not add `tags:` here. GitHub treats a push trigger carrying `tags`
  # but no `branches` as tag-only, which silently stops branch pushes from
  # building at all. TestFlight uploads are workflow_dispatch only, which is
  # also what keeps an irreversible (version, build) upload a deliberate act.
  push:
    branches: ["**"]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version for TestFlight upload
        required: false
        default: "1.12.1"
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test
        working-directory: apps/ios

  build:
    runs-on: macos-26
    needs: kit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (iOS 26 SDK required by App Store)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Build for simulator
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Rawkoon.xcodeproj -scheme Rawkoon \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    runs-on: macos-26
    needs: build
    # Dispatch only. A successful upload permanently consumes a (version, build)
    # pair on the live App Store Connect record and cannot be undone, so it is
    # never something a push should be able to cause by accident.
    if: github.event_name == 'workflow_dispatch'
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (iOS 26 SDK required by App Store)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
      - run: brew install xcodegen
      - name: Resolve release version
        working-directory: apps/ios
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKETING_VERSION="${{ inputs.version }}"
          else
            MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}"
          fi
          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_ENV"
          # Rawkoon has one publishing lane; github.run_number is already monotonic.
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - run: xcodegen generate
        working-directory: apps/ios
      # Pinned signing: import a fixed distribution cert + App Store profile from
      # secrets into a temporary keychain and sign manually. This replaces
      # -allowProvisioningUpdates, which minted a fresh cert on every run and
      # kept hitting Apple's certificate cap (and spamming revocation emails).
      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      # Signing settings live on the app target in project.yml, not here: an
      # xcodebuild command-line setting applies to every target in the project,
      # and SPM package targets reject a provisioning profile.
      - name: Archive signed app
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Rawkoon.xcodeproj \
            -scheme Rawkoon \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rawkoon.xcarchive \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - name: Export IPA
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Rawkoon.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
      - name: Upload to TestFlight
        working-directory: apps/ios
        run: |
          IPA_PATH=""
          for candidate in build/export/*.ipa; do
            IPA_PATH="$candidate"
            break
          done
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA produced by export step" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Distribute to internal testers
        working-directory: apps/ios
        env:
          BUNDLE_ID: cloud.samlo.rawkoon
          BUILD_NUMBER: ${{ env.CURRENT_PROJECT_VERSION }}
          WHATS_NEW: "Internal build from ${{ github.ref_name }} (${{ github.sha }})"
        run: node scripts/asc-distribute.mjs
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-ipa-${{ github.sha }}
          path: apps/ios/build/export/*.ipa
          if-no-files-found: warn
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawkoon-testflight-xcarchive-${{ github.sha }}
          path: apps/ios/build/Rawkoon.xcarchive
          if-no-files-found: warn
