name: rawkoon-dev

services:
  db:
    image: postgres:17
    container_name: rawkoon-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawkoon}
      POSTGRES_USER: ${POSTGRES_USER:-rawkoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rawkoon_password}
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rawkoon}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: rawkoon-valkey-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-${REDIS_HOST_PORT:-6381}}:6379"
    volumes:
      - valkey_data_dev:/data
    command: >
      sh -c "
      if [ -n \"$$VALKEY_PASSWORD\" ]; then
        valkey-server --requirepass \"$$VALKEY_PASSWORD\"
      else
        valkey-server
      fi
      "
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-${REDIS_PASSWORD:-}}

volumes:
  db_data_dev:
  valkey_data_dev:
