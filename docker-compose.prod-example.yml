services:
  rawkoon:
    image: ghcr.io/samuelloranger/rawkoon:latest
    container_name: rawkoon
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./vapid_keys:/app/vapid_keys
    restart: unless-stopped
    # Optional: GPU re-encoding (VA-API). See docs/self-hosting.md.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rawkoon-network
    ports:
      - "3000:3000"

  db:
    image: postgres:17
    container_name: rawkoon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - rawkoon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: rawkoon-valkey
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-${REDIS_PASSWORD}} --bind 0.0.0.0 --protected-mode yes
    volumes:
      - valkey_data:/data
    networks:
      rawkoon-network:
        # Alias so an existing .env with VALKEY_HOST/REDIS_HOST=redis still resolves.
        aliases:
          - redis

networks:
  rawkoon-network:
    driver: bridge

volumes:
  db_data:
  valkey_data:
